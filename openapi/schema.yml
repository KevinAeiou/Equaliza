openapi: 3.0.3
info:
  title: Equaliza API
  version: 1.0.0
  description: 'API do Equaliza: finanças familiares colaborativas.'
paths:
  /api/current/:
    patch:
      operationId: current_partial_update
      tags:
      - current
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentFamilyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentFamilyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentFamilyRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/families/:
    get:
      operationId: families_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - families
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFamilyOverviewList'
          description: ''
    post:
      operationId: families_create
