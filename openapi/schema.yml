components:
  schemas:
    AcceptInvitationData:
      type: object
      properties:
        family:
          $ref: '#/components/schemas/InvitationFamily'
      required:
      - family
    AcceptInvitationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AcceptInvitationData'
      required:
      - data
    AvatarEnum:
      enum:
      - avatar-1
      - avatar-2
      - avatar-3
      - avatar-4
      - avatar-5
      - avatar-6
      - avatar-7
      type: string
      description: |-
        * `avatar-1` - Avatar 1
        * `avatar-2` - Avatar 2
        * `avatar-3` - Avatar 3
        * `avatar-4` - Avatar 4
        * `avatar-5` - Avatar 5
        * `avatar-6` - Avatar 6
        * `avatar-7` - Avatar 7
    Balance:
      type: object
      properties:
        month:
          type: string
        settlement_start:
          type: string
        my_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        members:
          type: array
          items:
            $ref: '#/components/schemas/BalanceMember'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
      required:
      - members
      - month
      - my_balance
      - settlement_start
      - suggestions
    BalanceMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quota:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        previous_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        settled:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - balance
      - difference
      - id
      - is_active
      - name
      - paid
      - previous_balance
      - quota
      - settled
    CategoryComparison:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
          format: double
        average:
          type: number
          format: double
          nullable: true
        change:
          type: number
          format: double
          nullable: true
      required:
      - average
      - change
      - name
      - value
    CreateExpenseRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 1000
        category:
          type: integer
      required:
      - amount
      - category
    CreateFamilyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nome
          maxLength: 150
      required:
      - name
    CreateFinancialCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
      required:
      - name
      - type
    CreateIncomeRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 1000
        category:
          type: integer
      required:
      - amount
      - category
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    CreateRecurringTransactionRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 1000
        category:
          type: integer
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
      required:
      - amount
      - category
      - frequency
      - start_date
      - type
    CreateSettlementRequest:
      type: object
      properties:
        receiver:
          type: integer
          description: Id do usuário que recebe.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        month:
          type: string
          minLength: 1
          description: Mês acertado, no formato AAAA-MM.
        note:
          type: string
          default: ''
          maxLength: 255
        paid_at:
          type: string
          format: date
          description: Data do pagamento; hoje por padrão.
      required:
      - amount
      - month
      - receiver
    CustomTokenObtainPairRequest:
      type: object
      description: Serializador para obter um par de token e dados do usuário que
        usa email e senha para autenticação.
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    DashboardChart:
      type: object
      properties:
        income_vs_expense:
          type: array
          items:
            $ref: '#/components/schemas/IncomeVsExpense'
        expenses_by_category:
          type: array
          items:
            $ref: '#/components/schemas/ExpensesByCategory'
        member_contributions:
          type: array
          items:
            $ref: '#/components/schemas/MemberContributions'
      required:
      - expenses_by_category
      - income_vs_expense
      - member_contributions
    DashboardInsights:
      type: object
      properties:
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/CategoryComparison'
        has_expenses:
          type: boolean
        has_history:
          type: boolean
        has_previous:
          type: boolean
        history_periods:
          type: integer
        average_label:
          type: string
        above_count:
          type: integer
        below_count:
          type: integer
        dropped_count:
          type: integer
      required:
      - above_count
      - average_label
      - below_count
      - comparisons
      - dropped_count
      - has_expenses
      - has_history
      - has_previous
      - history_periods
      - insights
    DashboardSummary:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expense:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        members:
          type: integer
      required:
      - balance
      - expense
      - income
      - members
    Detail:
      type: object
      description: 'Resposta simples com uma mensagem (`{"detail": "..."}`).'
      properties:
        detail:
          type: string
      required:
      - detail
    ExpensesByCategory:
      type: object
      properties:
        category:
          type: string
        value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
      required:
      - category
      - value
    FamilyMemberStatus:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
      required:
      - id
    FamilyOverview:
      type: object
      description: 'Família vista pelo usuário logado: sua função e quantos membros
        ativos ela tem.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nome
        role:
          type: string
          nullable: true
          readOnly: true
        is_active_member:
          type: boolean
          readOnly: true
        members_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - is_active_member
      - members_count
      - name
      - role
      - updated_at
    FrequencyEnum:
      enum:
      - WEEKLY
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `WEEKLY` - Semanal
        * `MONTHLY` - Mensal
        * `YEARLY` - Anual
    Health:
      type: object
