  /api/finances/recurring/:
    get:
      operationId: finances_recurring_list
      parameters:
      - in: query
        name: frequency
        schema:
          type: string
          enum:
          - MONTHLY
          - WEEKLY
          - YEARLY
        description: |-
          * `WEEKLY` - Semanal
          * `MONTHLY` - Mensal
          * `YEARLY` - Anual
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
