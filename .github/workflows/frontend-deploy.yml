name: Deploy do frontend

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Os secrets dos hooks ficam no environment "Production" do GitHub.
    environment: Production
    steps:
      - name: Disparar deploy no Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::O secret VERCEL_DEPLOY_HOOK_URL não está configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
