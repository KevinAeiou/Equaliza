name: Deploy do backend

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Os secrets dos hooks ficam no environment "Production" do GitHub.
    environment: Production
    steps:
      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::O secret RENDER_DEPLOY_HOOK_URL não está configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # A URL do hook do Render já traz "?key=...", então o ref entra com "&".
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
            *) separator="?" ;;
          esac
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"
