# Instalação: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        # Roda no diretório do frontend; os caminhos chegam relativos à raiz do repositório.
        entry: bash -c 'cd frontend && npx eslint --max-warnings=-1 "${@#frontend/}"' --
